# The benchmark, with its local language models on epyc-02's CPU. Claim
# epyc-02 with dibs first; the workflow does not. root logs in over ssh by
# key. The llama.cpp build and the language models are those already on the
# host, checked by their SHA-256 before each is used.
[cijoe]
default_target = "epyc-02"

[cijoe.targets.epyc-02.ssh]
username = "root"
# cijoe connects with paramiko, which does not read ~/.ssh/config: give a
# name your resolver knows, or the address
hostname = "epyc-02"

[senfd]
repo = "https://github.com/safl/senfd"
commit = "6f85cc2b2cd167783b9dfe8d5d673bce4a4dc21b"
python = "3.12"

[spec]
# The ratified documents, as .docx from NVM Express, outside any repository
documents = "~/specs/*.docx"

[bench]
# The venv and the data model go here, never into the run's output
workdir = "/tmp/senfd-bench"

[llm]
server = "/root/oxio-img/build-ggml/llama.cpp/build/bin/llama-server"
threads = 16
context = 8192
port = 8088

[[llm.models]]
name = "llama-3.1-8b-instruct-q4_k_m"
path = "/root/models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
sha256 = "7b064f5842bf9532c91456deda288a1b672397a54fa729aa665952863033557c"

[[llm.models]]
name = "llama-3.2-1b-instruct-q4_k_m"
path = "/root/models/Llama-3.2-1B-Instruct-Q4_K_M.gguf"
sha256 = "6f85a640a97cf2bf5b8e764087b1e83da0fdb51d7c9fab7d0fece9385611df83"

[frontier]
models = ["claude-opus-5-5", "claude-sonnet-5-5"]
modes = ["allowed", "required"]
runs = 3

[cijoe.task]
fail_fast = true
