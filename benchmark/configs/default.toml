# The benchmark, run on this machine with its language models on the CPU.
# Make a copy of it for your machine, and change what differs there.
[cijoe]
# With no target named, every step runs here. To run llama-server on another
# machine, name it and say how to reach it over ssh, by key; sate reaches the
# server through an ssh tunnel. cijoe connects with paramiko, which does not
# read ~/.ssh/config: give a name your resolver knows, or the address.
#
# default_target = "llm-host"
#
# [cijoe.targets.llm-host.ssh]
# username = "root"
# hostname = "llm-host"

[senfd]
repo = "https://github.com/safl/senfd"
# A commit, a tag or a branch; the run records it
commit = "v0.10.0"
python = "3.12"

[spec]
# The documents, a glob of .pdf or .docx, outside any repository: the PDFs
# NVM Express publishes, downloaded as the documentation says
documents = "~/specs/*.pdf"

[bench]
# The venv and the data model go here, never into the run's output
workdir = "/tmp/senfd-bench"

[llm]
# llama.cpp's llama-server, by its name on PATH or by its path
server = "llama-server"
# The CPU's physical cores, or fewer
threads = 8
context = 8192
port = 8088

# The language models, each checked by its SHA-256 before it is used. These
# are the Q4_K_M files of bartowski/Meta-Llama-3.1-8B-Instruct-GGUF and
# bartowski/Llama-3.2-1B-Instruct-GGUF on Hugging Face.
[[llm.models]]
name = "llama-3.1-8b-instruct-q4_k_m"
path = "~/models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
sha256 = "7b064f5842bf9532c91456deda288a1b672397a54fa729aa665952863033557c"

[[llm.models]]
name = "llama-3.2-1b-instruct-q4_k_m"
path = "~/models/Llama-3.2-1B-Instruct-Q4_K_M.gguf"
sha256 = "6f85a640a97cf2bf5b8e764087b1e83da0fdb51d7c9fab7d0fece9385611df83"

# Answered from memory by Claude Code, 'claude -p', which must be logged in
[frontier]
models = ["claude-opus-5-5", "claude-sonnet-5-5"]
modes = ["allowed", "required"]
runs = 3

[cijoe.task]
fail_fast = true
