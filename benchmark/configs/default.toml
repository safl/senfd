# The benchmark, run on this machine with its language models on the CPU.
# Make a copy of it for your machine, and change what differs there.
[cijoe]
# With no target named, every step runs here. To run llama-server on another
# machine, name it and say how to reach it over ssh, by key; sate reaches the
# server through an ssh tunnel. cijoe connects with paramiko, which does not
# read ~/.ssh/config: give a name your resolver knows, or the address.
#
# default_target = "llm-host"
#
# [cijoe.targets.llm-host.ssh]
# username = "root"
# hostname = "llm-host"

[senfd]
repo = "https://github.com/safl/senfd"
# A commit, a tag or a branch; the run records it
commit = "v0.18.0"
python = "3.13"

[spec]
# The documents, a glob of .pdf or .docx, outside any repository: the PDFs
# NVM Express publishes, downloaded as the documentation says
documents = "~/specs/*.pdf"

[bench]
# The venv and the data model go here, never into the run's output
workdir = "/tmp/senfd-bench"
# The full transcripts of the frontier sessions, which hold text of the
# documents, go here, outside the repository
transcripts = "~/git/senfd-reports"

[llm]
# llama.cpp's llama-server, by its name on PATH or by its path
server = "llama-server"
# The CPU's physical cores, or fewer
threads = 8
context = 8192
port = 8088

# The language models, each checked by its SHA-256 before it is used. These
# are the Q4_K_M files of bartowski/Qwen2.5-7B-Instruct-GGUF and
# bartowski/Qwen2.5-1.5B-Instruct-GGUF on Hugging Face.
[[llm.models]]
name = "qwen2.5-7b-instruct-q4_k_m"
path = "~/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf"
sha256 = "65b8fcd92af6b4fefa935c625d1ac27ea29dcb6ee14589c55a8f115ceaaa1423"

[[llm.models]]
name = "qwen2.5-1.5b-instruct-q4_k_m"
path = "~/models/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"
sha256 = "1adf0b11065d8ad2e8123ea110d1ec956dab4ab038eab665614adba04b6c3370"

# Asked of Claude Code, 'claude -p', which must be logged in: one session a
# run, the questions one turn each, from memory, with sate-mcp, and with the
# PDFs of spec.documents
[frontier]
models = ["claude-opus-5-5", "claude-haiku-5-5"]
conditions = ["memory", "mcp", "pdf"]
modes = ["allowed"]
runs = 3
# Sessions at once; the most a session may cost, and a turn take
jobs = 4
budget_usd = 25
timeout = 900

[cijoe.task]
fail_fast = true
