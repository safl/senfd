doc: |
  NVMe questions answered by sate from the words of each question, by sate
  with a local language model on the target's CPU choosing the lookups, and
  by frontier language models as a coding agent asked in one session: from
  memory, with sate-mcp, and with the PDFs, allowed to say "unknown" and
  made to answer. Every answer is kept, and the report
  grades them against the data model of the documents.

    cijoe workflows/benchmark.yaml -c configs/default.toml -o results/<run>

steps:
- name: facts
  uses: core.facts_gather
- name: senfd
  uses: senfd_venv
- name: data_model
  uses: spec_model
- name: ask
  uses: lane_ask
- name: llm
  uses: lane_llm
- name: frontier
  uses: lane_agent
- name: report
  uses: report
