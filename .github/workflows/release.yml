---
name: release

# A merged 'ver: bump to vX.Y.Z' commit on main is published to PyPI, from the
# build the pull request tested, and tagged and released
on:
  push:
    branches:
    - "main"

defaults:
  run:
    shell: bash

jobs:
  release:
    if: >-
      startsWith(github.event.head_commit.message, 'ver: bump to v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
    - name: Grab source
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'

    - name: Check the version bump, and that its pull request was tested
      id: check
      uses: refenv/gha-project-auto-release/check@v1
      with:
        version-file: src/senfd/__init__.py
        version-pattern: '^__version__ = "([^"]+)"$'
        workflows: bd.yaml

    - name: Download the build the pull request tested
      env:
        RUN: ${{ fromJSON(steps.check.outputs.runs)['bd.yaml'] }}
        VERSION: ${{ steps.check.outputs.version }}
      run: |
        gh run download "$RUN" --repo "$REPO" --name dist --dir "$RUNNER_TEMP/dist"
        ls "$RUNNER_TEMP/dist/senfd-$VERSION.tar.gz" "$RUNNER_TEMP"/dist/senfd-"$VERSION"-*.whl

    - name: Publish tools
      run: |
        pipx install twine
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Publish the build to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        twine upload --skip-existing "$RUNNER_TEMP"/dist/*

    # Built from this tree, which the check step requires to be the one the
    # pull request's checks ran on, its container job building this image
    - name: Publish the image to the GitHub container registry
      env:
        VERSION: ${{ steps.check.outputs.version }}
        IMAGE: ghcr.io/${{ github.repository }}
        ACTOR: ${{ github.actor }}
      run: |
        docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
        echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        docker push "$IMAGE:$VERSION"
        docker push "$IMAGE:latest"

    - name: Tag, create the release, and attach the build
      uses: refenv/gha-project-auto-release/release@v1
      with:
        version: ${{ steps.check.outputs.version }}
        notes-file: ${{ steps.check.outputs.notes-file }}
        assets: ${{ runner.temp }}/dist/*
