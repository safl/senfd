---
name: Build and Publish

on:
  schedule:
  - cron: "0 0 * * *"
  pull_request:
  push:
    branches:
    - "!gh-pages"
    - "**"

# A push on a branch under review supersedes the runs of the push before it
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.13', '3.14', '3.15']

    steps:
    - name: Grab source
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set pipx default Python version
      run: echo "PIPX_DEFAULT_PYTHON=$(which python)" >> $GITHUB_ENV

    - name: Setup Environment
      run: |
        make env

    - name: Check format
      run: |
        make format

    - name: Build
      run: |
        make build install-dev

    - name: Upload the build, which a release publishes
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Run -- show help
      run: |
        senfd --help

    - name: Run -- actual IO
      run: |
        senfd example/example.docx --output output

    - uses: actions/upload-artifact@v4
      with:
        name: documents-enriched-${{ matrix.os }}-${{ matrix.python-version }}
        path: output

    # The specifications NVM Express publishes, which some tests read: kept
    # in this repository's Actions cache, which only its workflows restore,
    # and never uploaded
    - name: Cache the public specifications
      uses: actions/cache@v4
      with:
        path: ~/.cache/senfd/public
        key: public-documents-${{ hashFiles('tests/public/documents.toml') }}

    - name: Run -- tests
      run: |
        make test

    - uses: actions/upload-artifact@v4
      with:
        name: coverage-html-${{ matrix.os }}-${{ matrix.python-version }}
        path: htmlcov

    - name: Upload coverage to Coveralls
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
      uses: coverallsapp/github-action@v2.3.8
      with:
        file: coverage.lcov
        format: lcov
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # The reporter is downloaded on every run; when that fails, the build
        # has not. Coverage is enforced by the tests' --cov-fail-under.
        fail-on-error: false

  # The data model of every specification NVM Express publishes, made from its
  # PDF and compared with what tests/public/documents.toml says senfd makes of
  # it, then of all of them merged, compressed, and the benchmark's questions
  # answered from it by sate. The documents, and the data model derived
  # from them, stay in this job: nothing is uploaded, as the data model is
  # under the notice printed in each specification.
  public-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Grab source
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.15'

    - name: Install senfd
      run: |
        python -m pip install ".[dev]"

    - name: Cache the public specifications
      uses: actions/cache@v4
      with:
        path: ~/.cache/senfd/public
        key: public-documents-${{ hashFiles('tests/public/documents.toml') }}

    - name: Fetch the public specifications, checked by their SHA-256
      run: |
        python toolbox/public_documents.py fetch

    - name: Make the data model of each, and compare
      run: |
        python toolbox/public_documents.py check

    - name: Make the data model of them all, merged, and compress it
      run: |
        python toolbox/public_documents.py model ~/public-model

    - name: Answer the benchmark's questions from it, every one right
      run: |
        python toolbox/public_documents.py ask ~/public-model


  # The image for where installing senfd's dependencies is a problem: built,
  # then made to read the synthetic example and answer from it, as its user
  # would, with the documents and the data model in directories mounted
  container:
    runs-on: ubuntu-latest
    steps:
    - name: Grab source
      uses: actions/checkout@v4

    - name: Build the image
      run: |
        docker build -t senfd .

    - name: Make the data model of the example in it
      run: |
        mkdir -p ~/container-cache
        docker run --rm --user "$(id -u):$(id -g)" \
          -v "$PWD/example:/docs:ro" \
          -v ~/container-cache:/home/senfd/.cache/senfd \
          senfd sh -c 'senfd /docs/example.docx --output ~/.cache/senfd'

    - name: Ask sate in it
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -v ~/container-cache:/home/senfd/.cache/senfd \
          senfd sate --raw "opcode of ding" | tee answer.md
        grep -q "opcode 01h" answer.md

    # sate --llm against a real llama-server in router mode, which refuses a
    # request naming no model. The language model is a tiny one, so what this
    # checks is the plumbing, the request, its schema and the reply read,
    # and not how well it chooses.
    - name: Cache the tiny language model
      uses: actions/cache@v4
      with:
        path: ~/llm-models
        key: smollm2-135m-instruct-q4_k_m-2e8040ce

    - name: Fetch the tiny language model, checked by its SHA-256
      run: |
        mkdir -p ~/llm-models
        model=~/llm-models/SmolLM2-135M-Instruct-Q4_K_M.gguf
        test -f "$model" || curl -sSfL -o "$model" \
          https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf
        echo "2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d  $model" \
          | sha256sum -c

    - name: Serve it from llama-server in router mode
      run: |
        docker run -d --name llm --network host -v ~/llm-models:/models:ro \
          ghcr.io/ggml-org/llama.cpp:server-b11889 \
          --models-dir /models --host 127.0.0.1 --port 8088
        for i in $(seq 60); do
          curl -sf http://127.0.0.1:8088/health > /dev/null && break
          sleep 1
        done
        curl -sf http://127.0.0.1:8088/models

    - name: Ask sate in the image through it, the language model named
      run: |
        ask() {
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v ~/container-cache:/home/senfd/.cache/senfd \
            senfd sate --raw --llm http://127.0.0.1:8088 "$@" "what is FCNT of ding?"
        }
        # Unnamed, the router refuses it, so the check below can fail
        ask | tee unnamed.md
        grep -q "did not choose a lookup" unnamed.md
        ask --llm-model SmolLM2-135M-Instruct-Q4_K_M | tee named.md
        ! grep -q "did not choose a lookup" named.md
        grep -q "Understood as" named.md

    - name: The server's log
      if: always()
      run: |
        docker logs llm 2>&1 | tail -50 || true
