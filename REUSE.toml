version = 1

# The files that cannot carry a header of their own: data, images, the
# synthetic example documents, what senfd writes of them and what the
# documentation shows of that, and the benchmark's questions and the
# records of its runs
[[annotations]]
path = [
    "CHANGELOG.md",
    "LICENSE",
    "benchmark/questions.json",
    "docs/_static/**",
    "docs/_templates/**",
    "docs/casts/**",
    "docs/poetry.lock",
    "docs/src/**/*.cmd",
    "docs/src/**/*.out",
    "docs/src/stages/*.html",
    "docs/src/stages/*.json",
    "docs/src/stages/*.txt",
    "example/**",
    "src/senfd/schemas/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Simon A. F. Lund <os@safl.dk>"
SPDX-License-Identifier = "LGPL-2.1-only"
