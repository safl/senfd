[project]
name = "senfd"
dynamic = ["version"]
description = "Reads specification documents, extracts and normalizes their figures, and makes a structured data model of them"
authors = [
    { name = "Simon A. F. Lund", email = "os@safl.dk" }
]
license = { text = "LGPL-2.1-only" }
requires-python = ">=3.11"
dependencies = [
    "jinja2",
    "mcp>=2",
    "pdfplumber>=0.10",
    "pikepdf>=8",
    "prompt_toolkit>=3",
    "pydantic",
    "python-docx",
    "rich>=13",
]
readme = { file = "README.md", content-type = "text/markdown" }

[project.optional-dependencies]
# Empty, as what they brought is always installed; kept, so that installing
# senfd[sate,pdf], of a version before, still works
sate = []
pdf = []
dev = ["pyte", "pytest", "pytest-cov"]
all = ["senfd[dev]"]

[project.scripts]
senfd = "senfd.cli:main"
sate-mcp = "senfd.sate.mcp:main"
sate = "senfd.sate:main"


[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "senfd.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.jinja2", "*.schema.json", "*.toml"]

[tool.pytest.ini_options]
addopts = "--maxfail=1 --disable-warnings"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Beyond the defaults: bugbear, and a name rebound over an argument or the
# variable of its own loop. zip() is left without strict=, as making it
# strict would change what the code does where lengths differ.
extend-select = ["B", "PLR1704", "PLW2901"]
ignore = ["B905"]

# sate is held to annotated code throughout
[[tool.mypy.overrides]]
module = "senfd.sate.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
