[project]
name = "senfd"
dynamic = ["version"]
description = "Semantic Enhancer for Figure Documents"
authors = [
    { name = "Simon A. F. Lund", email = "os@safl.dk" }
]
license = { text = "LGPL-2.1-only" }
dependencies = [
    "jinja2",
    "pydantic",
    "python-docx",
    "tomli"
]
readme = { file = "README.rst", content-type = "text/x-rst" }

[project.optional-dependencies]
mcp = ["mcp>=2"]
ask = ["prompt_toolkit>=3", "rich>=13"]
dev = [
    "mcp>=2",
    "pytest",
    "pytest-cov",
]
all = ["senfd[dev,ask]"]

[project.scripts]
senfd = "senfd.cli:main"
senfd-query = "senfd.query:main"
senfd-mcp = "senfd.mcp_server:main"
senfd-ask = "senfd.ask:main"


[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "senfd.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.jinja2", "*.schema.json"]

[tool.pytest.ini_options]
addopts = "--maxfail=1 --disable-warnings"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
