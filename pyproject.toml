[project]
name = "senfd"
dynamic = ["version"]
description = "Reads specification documents, extracts and normalizes their figures, and makes a structured data model of them"
authors = [
    { name = "Simon A. F. Lund", email = "os@safl.dk" }
]
license = { text = "LGPL-2.1-only" }
requires-python = ">=3.10"
dependencies = [
    "jinja2",
    "pydantic",
    "python-docx",
    "tomli"
]
readme = { file = "README.rst", content-type = "text/x-rst" }

[project.optional-dependencies]
sate = ["mcp>=2", "prompt_toolkit>=3", "rich>=13"]
pdf = ["pikepdf>=8", "pdfplumber>=0.10"]
dev = [
    "mcp>=2",
    "pdfplumber>=0.10",
    "pikepdf>=8",
    "pyte",
    "pytest",
    "pytest-cov",
]
all = ["senfd[dev,sate,pdf]"]

[project.scripts]
senfd = "senfd.cli:main"
senfd-query = "senfd.query:main"
sate-mcp = "senfd.sate.mcp:main"
sate = "senfd.sate:main"


[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "senfd.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.jinja2", "*.schema.json"]

[tool.pytest.ini_options]
addopts = "--maxfail=1 --disable-warnings"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88

# sate is held to annotated code throughout
[[tool.mypy.overrides]]
module = "senfd.sate.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
